plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rumahtv.home'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.3-rumah.1'
    }

    // Rumah TV: a fixed key from the environment (CI secret) so every build installs over the last one.
    // Without it the build falls back to the debug key, as upstream does.
    def rumahKs = System.getenv('RUMAHTV_KEYSTORE')
    signingConfigs {
        rumah {
            if (rumahKs && file(rumahKs).exists()) {
                storeFile file(rumahKs)
                storePassword System.getenv('RUMAHTV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RUMAHTV_KEY_ALIAS') ?: 'rumahtv'
                keyPassword System.getenv('RUMAHTV_KEY_PASSWORD') ?: System.getenv('RUMAHTV_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig((rumahKs && file(rumahKs).exists()) ? signingConfigs.rumah : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
