name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Rumah TV signing key (optional repository secret)
        env:
          KS_B64: ${{ secrets.RUMAHTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rumahtv.jks"
            echo "RUMAHTV_KEYSTORE=$RUNNER_TEMP/rumahtv.jks" >> "$GITHUB_ENV"
            echo "signing with the Rumah TV key"
          else
            echo "::warning::RUMAHTV_KEYSTORE_B64 is not set: this APK uses a throwaway debug key and will not install over an earlier build"
          fi
      - name: Unit tests and release build
        working-directory: launcher
        env:
          RUMAHTV_KEYSTORE_PASSWORD: ${{ secrets.RUMAHTV_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 409600 || { echo "APK is over 400 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: rumah-tv-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
